spring:
  application:
    name: visora
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
    user: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
  datasource:
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  jpa:
    generate-ddl: off
    hibernate:
      ddl-auto: none
  mail:
    host: smtp.gmail.com
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    port: 587
    protocol: smtp
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
    display-name: VISORA
    logo: https://visora-mauve.vercel.app/assets/VisoraLogo-Bjo1BTBq.png
    project-url: https://visora-mauve.vercel.app
  profiles:
    active: dev

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 900
    refresh-token-expiration: 604800
  auth:
    verify-email-url: https://visora-mauve.vercel.app/auth/verify-email?token=%s
    reset-password-url: https://visora-mauve.vercel.app/auth/reset-password?token=%s

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: visora-bucket

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: swagger-ui.html
    enabled: true
    disable-swagger-default-url: true