name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    environment: PRODUCTION
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Variables
        run: |
          echo "TAG=${GITHUB_SHA::8}" >> "$GITHUB_ENV"
          echo "IMAGE=istad-visora-api" >> "$GITHUB_ENV"
          echo "SERVICE=visora-app" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
            -u "${{ secrets.GHCR_USERNAME }}" \
            --password-stdin

      - name: Build and Push Image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f Dockerfile \
            -t ghcr.io/${{ secrets.GHCR_USERNAME }}/${{ env.IMAGE }}:${{ env.TAG }} \
            -t ghcr.io/${{ secrets.GHCR_USERNAME }}/${{ env.IMAGE }}:latest \
            --push \
            .

      - name: Logout
        if: always()
        run: docker logout ghcr.io

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: GHCR_USERNAME,IMAGE,SERVICE
          script: |
            set -e

            cd ~/istad-visora-api

            docker pull ghcr.io/$GHCR_USERNAME/$IMAGE:latest

            docker compose up -d --no-deps $SERVICE

            docker image prune -f

        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          IMAGE: ${{ env.IMAGE }}
          SERVICE: ${{ env.SERVICE }}