[versions]

# PROJECT
version = "1.0.1"
javaLanguageVersion = "25"
springBootVersion = "4.1.1"

# SPRING DOC
springDependencyManagementVersion = '1.1.7'
springDocVersion = "3.1.0"

# TECHNOLOGIES
minioVersion = "9.0.3"
mapstructVersion = "1.5.5.Final"
lombokMapstructBindingVerision = "0.2.0"
jwtVersion = "0.12.6"

[libraries]
# SPRING
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-security-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-security-oauth2-resource-server" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-websocket = { module = "org.springframework.boot:spring-boot-starter-websocket" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-mail = { module = "org.springframework.boot:spring-boot-starter-mail" }
spring-boot-starter-mail-test = { module = "org.springframework.boot:spring-boot-starter-mail-test" }
spring-boot-starter-thymeleaf = { module = "org.springframework.boot:spring-boot-starter-thymeleaf" }
spring-boot-starter-thymeleaf-test = { module = "org.springframework.boot:spring-boot-starter-thymeleaf-test" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

# SPRING DATA
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-liquibase = { module = "org.springframework.boot:spring-boot-starter-liquibase" }
postgresql = { module = "org.postgresql:postgresql" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind" }

# SPRING DOC
springdoc-openapi-starter-webmvc-api = { module = "org.springdoc:springdoc-openapi-starter-webmvc-api", version.ref = "springDocVersion" }
springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springDocVersion" }

# TECHNOLOGIES
minio = { module = "io.minio:minio", version.ref = "minioVersion" }
jjwt-api = { module = "io.jsonwebtoken:jjwt-api", version.ref = "jwtVersion" }
jjwt-impl = { module = "io.jsonwebtoken:jjwt-impl", version.ref = "jwtVersion" }
jjwt-jackson = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jwtVersion" }

# LOMBOK & MAP STRUCT
lombok = { module = "org.projectlombok:lombok" }
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstructVersion" }
lombok-mapstruct-binding = { module = "org.projectlombok:lombok-mapstruct-binding", version.ref = "lombokMapstructBindingVerision" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstructVersion" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBootVersion" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagementVersion" }